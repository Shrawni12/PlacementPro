
{% extends "base.html" %}
{% block title %}Edit Application | PlacementPro{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Edit application</h1>
    <p>Update your company and application details.</p>

    <form method="post">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="company">Company name</label>
        <input id="company" name="company"
               value="{{ application['company'] }}"
               maxlength="150" required>

        <label for="role">Job role</label>
        <input id="role" name="role"
               value="{{ application['role'] }}"
               maxlength="150" required>

        <label for="status">Application status</label>
        <select id="status" name="status" required>
            {% for status_option in
                ['Applied', 'Assessment', 'Interview', 'Offer', 'Rejected'] %}
                <option value="{{ status_option }}"
                    {% if application['status'] == status_option %}
                        selected
                    {% endif %}>
                    {{ status_option }}
                </option>
            {% endfor %}
        </select>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"
                  rows="4" maxlength="2000">{{ application['notes'] or '' }}</textarea>

        <button type="submit" class="primary-button">
            Save changes
        </button>
    </form>

    <p><a href="{{ url_for('applications') }}">Cancel and go back</a></p>
</div>
{% endblock %}
