
{% extends "base.html" %}
{% block title %}Edit Interview | PlacementPro{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Edit interview</h1>

    <form method="post">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="company">Company</label>
        <input id="company" name="company"
               value="{{ interview['company'] }}"
               maxlength="150" required>

        <label for="role">Job role</label>
        <input id="role" name="role"
               value="{{ interview['role'] }}"
               maxlength="150" required>

        <label for="interview_round">Interview round</label>
        <input id="interview_round" name="interview_round"
               value="{{ interview['interview_round'] }}"
               maxlength="100" required>

        <label for="interview_date">Date</label>
        <input id="interview_date" name="interview_date"
               type="date" value="{{ interview['interview_date'] }}"
               required>

        <label for="interview_time">Time</label>
        <input id="interview_time" name="interview_time"
               type="time" value="{{ interview['interview_time'] }}"
               required>

        <label for="mode">Interview mode</label>
        <select id="mode" name="mode" required>
            {% for option in ['Online', 'In-person', 'Phone'] %}
                <option value="{{ option }}"
                    {% if interview['mode'] == option %}selected{% endif %}>
                    {{ option }}
                </option>
            {% endfor %}
        </select>

        <label for="status">Status</label>
        <select id="status" name="status" required>
            {% for option in ['Scheduled', 'Completed', 'Cancelled'] %}
                <option value="{{ option }}"
                    {% if interview['status'] == option %}selected{% endif %}>
                    {{ option }}
                </option>
            {% endfor %}
        </select>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"
                  rows="3" maxlength="2000">{{ interview['notes'] or '' }}</textarea>

        <button type="submit" class="primary-button">
            Save changes
        </button>
    </form>

    <p><a href="{{ url_for('interviews') }}">Cancel and go back</a></p>
</div>
{% endblock %}
